<!DOCTYPE html>
<html lang="uk"
      xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Вхід — BookCloud</title>

    <link rel="stylesheet"
          th:href="@{/css/auth.css}">

</head>

<body>

<div class="auth-page">

    <div class="auth-card">

        <div class="logo">
            📚 BookCloud
        </div>

        <h1>
            Вітаємо назад
        </h1>

        <p class="subtitle">
            Увійдіть у свій акаунт, щоб продовжити читання
        </p>


        <!-- Помилка входу -->

        <div
                class="alert error"
                th:if="${param.error}">

            Неправильний логін або пароль.

        </div>


        <!-- Вихід -->

        <div
                class="alert success"
                th:if="${param.logout}">

            Ви успішно вийшли з акаунта.

        </div>


        <form
                th:action="@{/login}"
                method="post"
                class="auth-form">


            <div class="form-group">

                <label for="username">
                    Ім'я користувача
                </label>

                <input
                        id="username"
                        type="text"
                        name="username"
                        placeholder="Введіть username"
                        required
                        autofocus
                >

            </div>


            <div class="form-group">

                <label for="password">
                    Пароль
                </label>

                <input
                        id="password"
                        type="password"
                        name="password"
                        placeholder="Введіть пароль"
                        required
                >

            </div>


            <button
                    type="submit"
                    class="submit-button">

                Увійти

            </button>

        </form>


        <div class="auth-footer">

            <span>
                Ще не маєте акаунта?
            </span>

            <a th:href="@{/register}">
                Зареєструватися
            </a>

        </div>

    </div>

</div>

</body>
</html>
