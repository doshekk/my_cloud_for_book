<!DOCTYPE html>
<html lang="uk"
      xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Мої книги — BookCloud</title>

    <link rel="stylesheet"
          th:href="@{/css/books.css}">

</head>

<body>

<header class="header">

    <div class="logo">
        📚 BookCloud
    </div>

    <nav class="navigation">

        <a th:href="@{/}">
            Головна
        </a>

        <a th:href="@{/books}"
           class="active">
            Мої книги
        </a>

        <a th:href="@{/books/upload}">
            Завантажити книгу
        </a>

    </nav>

    <div class="user">

        <span th:text="${username}">
            Username
        </span>

    </div>

</header>


<main class="container">

    <!-- Заголовок -->

    <section class="page-header">

        <div>

            <h1>
                Мої книги
            </h1>

            <p>
                Ваша особиста бібліотека
            </p>

        </div>

        <a th:href="@{/books/upload}"
           class="add-button">

            + Додати книгу

        </a>

    </section>


    <!-- Пошук -->

    <section class="search-section">

        <form th:action="@{/books}"
              method="get"
              class="search-form">

            <input
                    type="text"
                    name="search"
                    placeholder="Пошук книги або автора..."
                    th:value="${search}"
            >

            <select name="genre">

                <option value="">
                    Всі жанри
                </option>

                <option
                        th:each="genre : ${genres}"
                        th:value="${genre}"
                        th:text="${genre.ukrainianName}"
                        th:selected="${genre == selectedGenre}">
                </option>

            </select>

            <button type="submit">
                🔎 Пошук
            </button>

        </form>

    </section>


    <!-- Книги -->

    <section class="books">

        <article
                class="book-card"
                th:each="book : ${books}">

            <!-- Обкладинка -->

            <div class="book-cover">

                <img
                        th:if="${book.coverFileMetadata != null}"
                        th:src="@{/books/{id}/cover(id=${book.id})}"
                        th:alt="${book.title}"
                >

                <div
                        class="no-cover"
                        th:unless="${book.coverFileMetadata != null}">

                    📖

                </div>

            </div>


            <!-- Інформація -->

            <div class="book-content">

                <div class="book-title-row">

                    <h2 th:text="${book.title}">
                        Назва книги
                    </h2>

                    <!-- Улюблена -->

                    <form th:action="@{/books/{id}/favorite(id=${book.id})}"
                          method="post">

                        <button
                                type="submit"
                                class="favorite-button"
                                th:classappend="${book.favorite} ? 'favorite-active' : ''"
                                th:title="${book.favorite} ? 'Прибрати з улюблених' : 'Додати в улюблені'">

                            <span th:text="${book.favorite ? '★' : '☆'}">
                                ☆
                            </span>

                        </button>

                    </form>

                </div>


                <p class="author"
                   th:text="${book.author}">
                    Автор
                </p>


                <!-- Жанри -->

                <div class="tags"
                     th:if="${book.bookGenre != null}">

                    <span
                            class="tag genre"
                            th:each="genre : ${book.bookGenre}"
                            th:text="${genre.ukrainianName}">

                        Жанр

                    </span>

                </div>


                <!-- Статус -->

                <div class="status">

                    <span
                            class="tag read"
                            th:if="${book.readStatus.name() == 'READ'}">

                        ✓ Прочитано

                    </span>

                    <span
                            class="tag reading"
                            th:if="${book.readStatus.name() == 'READING'}">

                        📖 Читаю

                    </span>

                    <span
                            class="tag planned"
                            th:if="${book.readStatus.name() == 'PLANNED'}">

                        📚 Заплановано

                    </span>

                </div>


                <!-- Дата додавання -->

                <div class="date"
                     th:if="${book.addTime != null}">

                    Додано:

                    <span
                            th:text="${#temporals.format(book.addTime, 'dd.MM.yyyy')}">

                        21.08.2026

                    </span>

                </div>


                <!-- Кнопки -->

                <div class="actions">

                    <a th:href="@{/books/{id}/read(id=${book.id})}"
                       class="open">
                        Відкрити
                    </a>

                    <a th:href="@{/books/{id}/download(id=${book.id})}"
                       class="download">
                        Завантажити
                    </a>

                    <a th:href="@{/books/{id}/edit(id=${book.id})}"
                       class="edit">
                        Редагувати
                    </a>

                    <form th:action="@{/books/{id}/delete(id=${book.id})}"
                          method="post">

                        <button type="submit"
                                class="delete"
                                onclick="return confirm('Ви впевнені, що хочете видалити цю книгу?');">
                            Видалити
                        </button>

                    </form>

                </div>

            </div>

        </article>


        <!-- Якщо книг немає -->

        <div
                class="empty"
                th:if="${#lists.isEmpty(books)}">

            <div class="empty-icon">
                📚
            </div>

            <h2>
                У вас ще немає книг
            </h2>

            <p>
                Завантажте свою першу книгу
            </p>

            <a th:href="@{/books/upload}">
                + Додати книгу
            </a>

        </div>

    </section>

</main>

</body>
</html>
